spring.application.name=ai-code-reviewer
server.port=8080

# MySQL (override with environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/code_reviewer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Gemini (never commit your real key - set GEMINI_API_KEY as an env variable)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
